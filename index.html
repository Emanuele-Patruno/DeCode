<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DeCode — Equivalenze e Profumi. Trova rapidamente il codice del tuo dupe preferito.">
  <meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>DeCode — Equivalenze e Profumi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════
       HEADER
  ═══════════════════════════════════════ -->
  <header class="header" id="mainHeader">
    <div class="header-inner">
      <div class="logo" id="logoBtn">
        <svg class="logo-svg" width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="logo-left"><rect x="0" y="0" width="50" height="100"/></clipPath>
            <clipPath id="logo-right"><rect x="50" y="0" width="50" height="100"/></clipPath>
          </defs>
          <g clip-path="url(#logo-left)" fill="none" stroke="#D97706" stroke-width="2.8">
            <rect x="35" y="22" width="30" height="56" rx="6"/>
            <rect x="41" y="14" width="18" height="9" rx="3.5" stroke-width="2.2"/>
            <rect x="43" y="9" width="14" height="6" rx="3" stroke-width="0" fill="#D97706" opacity="0.35"/>
          </g>
          <g clip-path="url(#logo-right)" fill="#D97706">
            <circle cx="55" cy="25" r="2.4" opacity="0.85"/>
            <circle cx="64" cy="27" r="1.6" opacity="0.55"/>
            <circle cx="55" cy="36" r="2.6" opacity="0.78"/>
            <circle cx="66" cy="37" r="1.4" opacity="0.42"/>
            <circle cx="55" cy="47" r="2.6" opacity="0.72"/>
            <circle cx="65" cy="49" r="1.7" opacity="0.46"/>
            <circle cx="55" cy="58" r="2.4" opacity="0.65"/>
            <circle cx="64" cy="60" r="1.5" opacity="0.38"/>
            <circle cx="55" cy="68" r="2.2" opacity="0.55"/>
            <circle cx="65" cy="69" r="1.3" opacity="0.32"/>
            <circle cx="55" cy="76" r="2" opacity="0.44"/>
          </g>
          <path d="M50 80 Q50 86 50 89" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55"/>
          <path d="M50 91 Q47.5 96 50 99 Q52.5 96 50 91Z" fill="#D97706" opacity="0.6"/>
        </svg>
        <div class="logo-text">
          <span class="logo-name">DeCode</span>
          <span class="logo-tagline">Scopri il tuo dupe</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn quiz-trigger-btn" id="quizBtn" aria-label="Trova il tuo profumo" title="Trova il tuo profumo">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </button>
        <button class="icon-btn" id="favBtn" aria-label="Preferiti" title="Preferiti">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span class="fav-badge" id="favBadge" style="display:none">0</span>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Cambia tema" title="Cambia tema">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════
       STICKY ZONE (search + filters)
  ═══════════════════════════════════════ -->
  <div class="sticky-zone">
  <div class="search-wrap" id="searchWrap">
    <div class="search-box">
      <svg class="search-ico" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Cerca profumo originale o brand..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
      >
      <button class="search-clear" id="searchClear" aria-label="Cancella ricerca" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       SEARCH BAR ROW (stats + filter button)
  ═══════════════════════════════════════ -->
  <div class="filters-bar" id="filtersBar">
    <span class="stats-text" id="statsText">Caricamento...</span>
    <div class="filters-bar-actions">
      <button class="sort-btn" id="sortBtn" title="Ordina">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
        <span id="sortLabel">Eq. 0–9</span>
      </button>
      <button class="filter-toggle-btn" id="filterToggleBtn" aria-expanded="false" aria-controls="filterPanel">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filtri
        <span class="filter-badge" id="filterBadge" style="display:none">0</span>
      </button>
    </div>
  </div>

  </div><!-- /sticky-zone -->

  <!-- ═══════════════════════════════════════
       FILTER MODAL (bottom sheet)
  ═══════════════════════════════════════ -->
  <div class="modal-overlay" id="filterOverlay" role="dialog" aria-modal="true" aria-label="Filtri">
    <div class="modal-sheet" id="filterSheet">
      <div class="modal-drag-handle-zone" id="filterDragHandle">
        <div class="modal-drag-handle"></div>
      </div>
      <div class="modal-header">
        <span class="modal-title-text">Filtri</span>
        <button class="icon-btn text-btn" id="filterResetBtn">Azzera</button>
      </div>
      <div class="modal-body filter-modal-body">

        <div class="filter-group">
          <span class="filter-group-label">Sezione</span>
          <div class="chips-scroll">
            <button class="chip active" data-section="all">Tutti</button>
            <button class="chip" data-section="main">Classici</button>
            <button class="chip" data-section="les-secrets">Les Secrets</button>
            <button class="chip" data-section="senteurs-orient">Senteurs d'Orient</button>
            <button class="chip" data-section="in-production">In Produzione</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-group-label">Marca</span>
          <select class="accord-select" id="brandSelect">
            <option value="">Tutte le marche</option>
          </select>
        </div>

        <div class="filter-group" id="extraFilters" style="display:none">
          <span class="filter-group-label">Genere</span>
          <div class="gender-chips" id="genderChips">
            <button class="chip chip-sm" data-gender="women" onclick="toggleGender(this)">Donna</button>
            <button class="chip chip-sm" data-gender="men" onclick="toggleGender(this)">Uomo</button>
            <button class="chip chip-sm" data-gender="unisex" onclick="toggleGender(this)">Unisex</button>
          </div>
          <span class="filter-group-label" style="margin-top:12px">Accordo</span>
          <select class="accord-select" id="accordSelect">
            <option value="">Tutti gli accordi</option>
          </select>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       MAIN LIST
  ═══════════════════════════════════════ -->
  <main class="main" id="mainContent">

    <div id="skeletonList" class="perfume-grid">
      <!-- Skeleton cards generated by JS -->
    </div>

    <div id="perfumeGrid" class="perfume-grid" style="display:none"></div>

    <div id="emptyState" class="state-card" style="display:none">
      <div class="state-emoji">🔍</div>
      <h3 class="state-title">Nessun risultato</h3>
      <p class="state-desc">Prova con termini diversi o cerca per brand</p>
      <button class="btn-primary" id="clearSearchBtn">Cancella ricerca</button>
    </div>

    <div id="errorState" class="state-card" style="display:none">
      <div class="state-emoji">⚠️</div>
      <h3 class="state-title">Errore di caricamento</h3>
      <p class="state-desc">Impossibile recuperare i dati dal foglio. Verifica la connessione e riprova.</p>
      <button class="btn-primary" id="retryBtn">Riprova</button>
    </div>

  </main>

  <!-- ═══════════════════════════════════════
       BACK TO TOP
  ═══════════════════════════════════════ -->
  <button class="back-top" id="backTop" aria-label="Torna in cima" style="display:none">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <!-- ═══════════════════════════════════════
       DETAIL MODAL
  ═══════════════════════════════════════ -->
  <div class="modal-overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-label="Dettaglio profumo">
    <div class="modal-sheet" id="detailSheet">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <button class="icon-btn modal-back" id="detailClose" aria-label="Chiudi">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="modal-title-text">Dettaglio</span>
        <button class="icon-btn" id="detailFavBtn" aria-label="Aggiungi ai preferiti">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </button>
      </div>
      <div class="modal-body" id="detailBody">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       FAVORITES SHEET
  ═══════════════════════════════════════ -->
  <div class="modal-overlay" id="favOverlay" role="dialog" aria-modal="true" aria-label="Preferiti">
    <div class="modal-sheet" id="favSheet">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <button class="icon-btn" id="favClose" aria-label="Chiudi preferiti">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="modal-title-text">Preferiti</span>
        <button class="icon-btn text-btn" id="favClearBtn" aria-label="Rimuovi tutti i preferiti">Svuota</button>
      </div>
      <div class="modal-body" id="favBody">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       TOAST
  ═══════════════════════════════════════ -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="js/app.js"></script>
  <!-- ═══════════════════════════════════════
       QUIZ MODAL
  ═══════════════════════════════════════ -->
  <div class="modal-overlay" id="quizOverlay" role="dialog" aria-modal="true" aria-label="Trova il tuo profumo">
    <div class="modal quiz-modal">
      <div class="quiz-header">
        <button class="detail-close" id="quizClose" aria-label="Chiudi">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="quiz-progress" id="quizProgress">
          <div class="quiz-progress-bar" id="quizProgressBar"></div>
        </div>
        <span class="quiz-step-label" id="quizStepLabel">Domanda 1 di 3</span>
      </div>
      <div class="quiz-body" id="quizBody">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

</body>
</html>
